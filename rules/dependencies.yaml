rules:
  - id: ARCH-001
    name: Domain does not depend on infrastructure
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under a context's domain/ package may import from that
      context's infrastructure/ package or from commons/infrastructure/.
    rationale: >
      Inverting this dependency (DIP) lets the core be tested without a
      database and lets the store be swapped without touching business rules.
    correct: |
      # sales/domain/model/ports.py
      class OrderRepository(Protocol):
          def get(self, order_id: OrderId) -> Order: ...
    incorrect: |
      # sales/domain/model/order.py
      from sales.infrastructure.postgres_order_repository import PostgresOrderRepository
    validation:
      tool: import-linter
      detail: layered contract; domain is the innermost layer
    related: [ARCH-008]
  - id: ARCH-002
    name: Domain does not depend on application
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under a context's domain/ package imports from that context's
      application/ package.
    rationale: >
      The domain is the innermost layer; use-case orchestration depends on it,
      never the reverse.
    correct: |
      # sales/application/order_service.py
      from sales.domain.model.order import Order
    incorrect: |
      # sales/domain/model/order.py
      from sales.application.order_service import OrderService
    validation:
      tool: import-linter
      detail: layered contract
  - id: ARCH-003
    name: Domain does not depend on frameworks
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under a context's domain/ package imports a web framework, an
      ORM, a DI container, or pydantic.
    rationale: >
      A framework-free domain stays unit-testable without a runtime and keeps
      vendor choices out of the business core.
    correct: |
      # sales/domain/model/order.py
      from dataclasses import dataclass
      from commons.types.ids import EntityId
    incorrect: |
      # sales/domain/model/order.py
      from pydantic import BaseModel
      from sqlalchemy.orm import Mapped
    validation:
      tool: import-linter
      detail: forbidden contract; domain -/-> (pydantic, sqlalchemy, fastapi, ...)
  - id: ARCH-004
    name: Domain performs no I/O
    level: MUST
    automation: partial
    category: dependencies
    description: >
      No module under a context's domain/ package calls the wall clock, a
      random source, the network, or the disk; time and identity arrive through
      the Clock and IdGenerator ports.
    rationale: >
      A domain that reads datetime.now() or a socket is non-deterministic and
      cannot be tested in microseconds.
    correct: |
      # sales/domain/model/order.py
      @classmethod
      def place(cls, clock: Clock, ids: IdGenerator) -> "Order":
          return cls(id=ids.next_identity(), placed_at=clock.now())
    incorrect: |
      # sales/domain/model/order.py
      from datetime import datetime
      placed_at = datetime.now()
    validation:
      tool: ruff
      detail: flake8-tidy-imports banned-api (datetime.now, uuid4, open, socket) in domain/
  - id: ARCH-005
    name: Application does not depend on infrastructure
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under a context's application/ package imports from that
      context's infrastructure/ package or from commons/infrastructure/.
    rationale: >
      Orchestration names ports only; the concrete adapter is injected from
      providers.py and is never imported by the use case.
    correct: |
      # sales/application/order_service.py
      def __init__(self, orders: OrderRepository, uow: UnitOfWork) -> None: ...
    incorrect: |
      # sales/application/order_service.py
      from sales.infrastructure.order_repository import SqlAlchemyOrderRepository
    validation:
      tool: import-linter
      detail: layered contract
  - id: ARCH-006
    name: Application does not depend on entrypoints
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under a context's application/ package imports from that
      context's entrypoints/ package.
    rationale: >
      Entrypoints are inbound adapters that call the application; the
      dependency arrow never points back out to transport code.
    correct: |
      # sales/entrypoints/http.py
      from sales.application.order_service import OrderService
    incorrect: |
      # sales/application/order_service.py
      from sales.entrypoints.http import parse_body
    validation:
      tool: import-linter
      detail: layered contract
  - id: ARCH-007
    name: Application does not construct concrete adapters
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under a context's application/ package instantiates an
      infrastructure adapter class such as SqlAlchemyOrderRepository(...) or
      HttpCreditGateway(...).
    rationale: >
      Constructing an adapter couples the use case to one technology choice and
      defeats dependency injection.
    correct: |
      # sales/entrypoints/providers.py
      orders = SqlAlchemyOrderRepository(uow)
      return OrderService(uow=uow, orders=orders)
    incorrect: |
      # sales/application/order_service.py
      self._orders = SqlAlchemyOrderRepository(SqlAlchemyUnitOfWork())
    validation:
      tool: grimp
      detail: import-graph assert; no application module reaches an infrastructure symbol
    related: [ARCH-005]
  - id: ARCH-008
    name: Infrastructure implements ports; the core imports abstractions only
    level: MUST
    automation: full
    category: dependencies
    description: >
      Every concrete adapter in a context's infrastructure/ package implements a
      Protocol declared in domain/model/ports.py or a colocated application
      Protocol; domain/ and application/ import only those abstractions.
    rationale: >
      The core names the contract it needs and infrastructure plugs in behind
      it, so the store can be replaced without editing business rules.
    correct: |
      # sales/infrastructure/order_repository.py
      class SqlAlchemyOrderRepository:  # implements OrderRepository (domain port)
          def get(self, order_id: OrderId) -> Order: ...
    incorrect: |
      # sales/domain/services/order_pricing.py
      from sales.infrastructure.order_repository import SqlAlchemyOrderRepository
    validation:
      tool: import-linter
      detail: layered contract; domain/application import ports, never adapters
    related: [ARCH-001, ARCH-042]
  - id: ARCH-009
    name: Entrypoints obtain wired services from providers; never construct or call infrastructure directly
    level: MUST
    automation: partial
    category: dependencies
    description: >
      No module under a context's entrypoints/ package constructs an
      infrastructure adapter or calls persistence, sessions, or HTTP clients
      directly; it obtains a fully wired service from providers.py and calls
      only that service.
    rationale: >
      An entrypoint that news up a repository or calls session.execute is
      untestable without transport and leaks wiring across the boundary.
    correct: |
      # sales/entrypoints/http.py
      service = providers.order_service()
      service.create_order(command)
    incorrect: |
      # sales/entrypoints/http.py
      repo = SqlAlchemyOrderRepository(SqlAlchemyUnitOfWork())
      repo.save(order)
    validation:
      tool: ast-checker
      detail: entrypoints/ must not import infrastructure/ or call repo/session/http_client
    related: [ARCH-037]
  - id: ARCH-010
    name: Entrypoints contain no business logic
    level: SHOULD
    automation: partial
    category: dependencies
    description: >
      A module under a context's entrypoints/ package does not branch on
      business meaning; it translates the stimulus into a command, calls one
      service method, and maps the result or exception back to the transport.
    rationale: >
      Business rules in a controller are hidden from domain tests and cannot be
      reused by another entrypoint.
    correct: |
      # sales/entrypoints/http.py
      cmd = CreateOrder(customer_id=body.customer_id, lines=body.lines)
      return _to_response(service.create_order(cmd))
    incorrect: |
      # sales/entrypoints/http.py
      if order.total > customer.credit_limit:
          raise HTTPException(402)
    validation:
      tool: review
      detail: PR checklist; does the handler decide anything about business meaning?
  - id: ARCH-011
    name: Entrypoints call application services, not other entrypoints
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under a context's entrypoints/ package imports or calls another
      entrypoint module (providers.py aside).
    rationale: >
      Chaining entrypoints hides a use case behind transport translation and
      duplicates orchestration.
    correct: |
      # sales/entrypoints/cli.py
      from sales.entrypoints import providers
      providers.order_service().create_order(cmd)
    incorrect: |
      # sales/entrypoints/cli.py
      from sales.entrypoints.http import create_order_handler
    validation:
      tool: import-linter
      detail: forbidden contract; entrypoints/*.py -/-> entrypoints/*.py except providers
  - id: ARCH-012
    name: A context imports nothing from another context
    level: MUST
    automation: full
    category: dependencies
    description: >
      A bounded context imports nothing from another bounded context (its
      domain/, application/, or infrastructure/ packages).
    rationale: >
      Keeps contexts substitutable and independently deployable; a change
      inside one context cannot break another; the contract between teams stays
      explicit.
    correct: |
      # sales needs a credit check
      # sales/domain/model/ports.py declares CreditCheckPort (consumer-driven)
      # bootstrap/ wires an adapter backed by billing's application service
    incorrect: |
      from billing.domain.invoice import Invoice   # in sales/
    validation:
      tool: import-linter
      detail: independence contract
    related: [ARCH-013, ARCH-025, ARCH-045]
  - id: ARCH-013
    name: No dependency cycles between contexts
    level: SHOULD
    automation: full
    category: dependencies
    description: >
      The import graph over the top-level context packages is acyclic; no two
      contexts import each other, directly or transitively.
    rationale: >
      A cycle fuses two contexts into one unit that cannot be reasoned about,
      tested, or extracted separately.
    correct: |
      # sales declares a consumer-driven port; bootstrap wires a billing adapter
      # billing does not import sales
    incorrect: |
      # sales/infrastructure/credit_gateway.py imports billing.application...
      # billing/infrastructure/order_gateway.py imports sales.application...
    validation:
      tool: grimp
      detail: import-graph cycle detection across top-level context packages
    related: [ARCH-012]
  - id: ARCH-014
    name: shared_kernel imports nothing from any context
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under shared_kernel/ imports from any src/<context> package.
    rationale: >
      The shared kernel is upstream of every context; importing a context would
      invert the governance direction and couple all consumers.
    correct: |
      # shared_kernel/money.py
      from commons.types.errors import DomainError
    incorrect: |
      # shared_kernel/pricing.py
      from sales.domain.model.order import Order
    validation:
      tool: import-linter
      detail: forbidden contract; shared_kernel -/-> contexts
  - id: ARCH-015
    name: commons/types imports nothing from contexts, application, infrastructure, or shared_kernel
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under commons/types/ imports from any context package, from any
      application/ or infrastructure/ package, or from shared_kernel/.
    rationale: >
      commons/types is the dependency-free base importable by everyone
      including domain/; any upward import would create a cycle.
    correct: |
      # commons/types/clock.py
      from typing import Protocol
    incorrect: |
      # commons/types/ids.py
      from sales.domain.model.order import OrderId
    validation:
      tool: import-linter
      detail: forbidden contract; commons.types -/-> everything above it
    related: [ARCH-035]
  - id: ARCH-016
    name: commons/types contains no business logic
    level: MUST
    automation: manual
    category: dependencies
    description: >
      Modules under commons/types/ hold only dependency-free technical
      primitives and Protocols, with no rule a business person would recognise.
    rationale: >
      A business policy hidden in commons/types is invisible to the owning
      context and silently shared with every other one.
    correct: |
      # commons/types/pagination.py
      @dataclass(frozen=True)
      class Page:
          items: tuple[object, ...]
          total: int
    incorrect: |
      # commons/types/pricing.py
      VAT_RATE = Decimal("0.21")  # a tax rule belongs to a context or shared_kernel
    validation:
      tool: review
      detail: PR checklist; would you mention this when describing the business?
  - id: ARCH-017
    name: Nothing imports bootstrap
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module outside bootstrap/ imports from bootstrap/, with main.py the
      only exception.
    rationale: >
      bootstrap/ is the composition root; importing it from a context pulls
      wiring and config into business code and creates a god-module dependency.
    correct: |
      # main.py
      from bootstrap.container import build_container
    incorrect: |
      # sales/application/order_service.py
      from bootstrap.container import build_container
    validation:
      tool: import-linter
      detail: forbidden contract; * -/-> bootstrap (allow main.py)
  - id: ARCH-034
    name: commons/infrastructure is not imported by domain or application
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under any context's domain/ or application/ package imports
      from commons/infrastructure/.
    rationale: >
      commons/infrastructure holds framework-bound implementations; only
      infrastructure/, entrypoints/, bootstrap/, and tests may touch them.
    correct: |
      # sales/infrastructure/unit_of_work.py
      from commons.infrastructure.unit_of_work import SqlAlchemyUnitOfWork
    incorrect: |
      # sales/application/order_service.py
      from commons.infrastructure.unit_of_work import SqlAlchemyUnitOfWork
    validation:
      tool: import-linter
      detail: forbidden contract; domain|application -/-> commons.infrastructure
  - id: ARCH-035
    name: commons/types does not import any framework
    level: MUST
    automation: full
    category: dependencies
    description: >
      No module under commons/types/ imports a web framework, an ORM, a DI
      container, pydantic, or any other third-party runtime library.
    rationale: >
      commons/types must stay importable with zero third-party dependencies so
      the domain that depends on it stays pure.
    correct: |
      # commons/types/event_bus.py
      from typing import Iterable, Protocol
    incorrect: |
      # commons/types/unit_of_work.py
      from sqlalchemy.orm import Session
    validation:
      tool: import-linter
      detail: forbidden contract; commons.types -/-> (sqlalchemy, fastapi, pydantic, ...)
    related: [ARCH-015]
  - id: ARCH-037
    name: Entrypoint wiring is defined in per-context providers.py, backed by bootstrap
    level: MUST
    automation: partial
    category: dependencies
    description: >
      Each context exposes its wired services through entrypoints/providers.py,
      which pulls singletons and factories from the bootstrap/ container;
      entrypoints import services only from providers.py.
    rationale: >
      One per-context wiring seam keeps construction out of handlers and gives
      the composition root a single place to assemble each service.
    correct: |
      # sales/entrypoints/providers.py
      def order_service() -> OrderService:
          uow = unit_of_work()
          return OrderService(uow=uow, orders=SqlAlchemyOrderRepository(uow), bus=event_bus())
    incorrect: |
      # sales/entrypoints/http.py
      order_service = OrderService(uow=SqlAlchemyUnitOfWork(), orders=..., bus=...)
    validation:
      tool: ast-checker
      detail: providers.py present per context; entrypoints import wired services only from it
    related: [ARCH-009]
