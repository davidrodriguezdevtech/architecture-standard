project_name:
  type: str
  help: "Human-readable project name"
  default: "My Project"

project_slug:
  type: str
  help: "Python distribution slug (kebab-case)"
  default: "{{ project_name.lower().replace(' ', '-') }}"

context_name:
  type: str
  help: "The first bounded context's folder name (snake_case)"
  default: "sales"

aggregate_name:
  type: str
  help: "The first aggregate's name, singular (snake_case)"
  default: "order"

aggregate_module:
  type: str
  help: "The aggregate module's folder name, usually the plural"
  default: "{{ aggregate_name }}s"

arch_standard_version:
  type: str
  help: "arch-standard version to pin as a dependency"
  default: "0.1.1"

arch_commons_version:
  type: str
  help: "arch-commons version to pin as a dependency"
  default: "0.1.0"

template_version:
  type: str
  help: "This template's own version, recorded in the .arch-standard stamp"
  default: "0.1.0"

dependency_source:
  type: str
  help: >-
    Where the generated project resolves arch-standard and arch-commons from.
    'index' emits plain version pins (use a package index, or `uv sync` with
    --find-links against locally built wheels). 'git' emits direct git
    references and requires standard_git_url below.
  choices:
    - index
    - git
  default: index

standard_git_url:
  type: str
  when: "{{ dependency_source == 'git' }}"
  help: "Git URL of your architecture-standard remote (no default -- supply your own)"

_tasks:
  - "arch-standard render-importlinter ."
