rules:
  - id: ARCH-043
    name: Every published message uses the commons event envelope
    level: "MUST*"
    automation: partial
    category: cross_cutting
    description: >
      Every published integration message is wrapped in the commons/
      EventEnvelope carrying correlation_id, causation_id, occurred_at,
      event_type, event_version, and payload, and the correlation id is read
      from the contextvar set by the entrypoint.
    rationale: >
      A uniform envelope with a correlation id on a contextvar is what makes an
      asynchronous flow traceable through a broker.
    correct: |
      envelope = EventEnvelope.wrap(OrderPlacedV1(order_id=str(order.id)))
      bus.publish(envelope)
    incorrect: |
      bus.publish({"order_id": str(order.id)})   # no envelope, no correlation id
    validation:
      tool: ast-checker
      detail: publish call argument must be an EventEnvelope with the six required fields
    related: [ARCH-036, ARCH-044]
  - id: ARCH-044
    name: Every integration event has a published schema in the events catalog
    level: "MUST*"
    automation: partial
    category: cross_cutting
    description: >
      For every integration event a context publishes there is a versioned
      schema file in the events catalog, and the producer contract test
      validates each emitted event against it.
    rationale: >
      The published schema is the Published Language, the single artifact
      producers and consumers agree on, versioned so a change is a new event
      version rather than an in-place edit.
    correct: |
      # events_catalog/sales/order_placed.v1.json  (JSON Schema)
      # producer test: every emitted OrderPlaced validates against it
    incorrect: |
      # OrderPlaced is published; no schema file exists; the field set changes in place
    validation:
      tool: schema
      detail: every published event has a catalog schema; producer fixtures validate against it
    related: [ARCH-024]
  - id: ARCH-053
    name: The core does not log
    level: MUST
    automation: full
    category: cross_cutting
    description: >
      Modules under domain/ and application/ import no logging library and make no
      logging calls. They raise domain exceptions and emit domain events; entrypoints and
      outbound adapters log.
    rationale: >
      Logging is an observability concern of the adapters. Keeping it out of the core
      keeps the core free of ambient I/O and makes behavior fully assertable from the
      state and events a use case produces.
    correct: |
      # application: emit a fact
      self._bus.publish_all(self._uow.collect_new_events())
    incorrect: |
      # application
      import logging
      logging.getLogger(__name__).info("order created")
    validation:
      tool: ruff
      detail: banned logging imports/calls under domain/ and application/
