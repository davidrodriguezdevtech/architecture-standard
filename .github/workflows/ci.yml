name: ci
on:
  push: { branches: [main, master] }
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run --package arch-commons ruff check packages/arch-commons
      - run: uv run --package arch-commons ruff format --check packages/arch-commons
      - run: uv run --package arch-commons mypy --config-file packages/arch-commons/pyproject.toml packages/arch-commons/src packages/arch-commons/tests
      - run: uv run --package arch-commons pytest -c packages/arch-commons/pyproject.toml packages/arch-commons/tests
      - run: uv run arch-standard docs --check
      # Dogfooding: the validator must pass on conforming projects and fail on violations.
      - run: uv run arch-standard check tests/fixtures/good_project
      - run: uv run arch-standard check tests/fixtures/modular_project
      - name: the violation fixture must actually fail
        run: |
          if uv run arch-standard check tests/fixtures/bad_project; then
            echo "bad_project passed -- the validator is not detecting violations"
            exit 1
          fi
      # Catalog governance: the compatibility policy is enforced, not advisory.
      - run: uv run arch-standard release-check --version 0.1.0
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: make e2e
