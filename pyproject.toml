[project]
name = "arch-standard"
version = "0.3.0"
description = "Architecture Standard v1 — rule catalog, validator, and doc generator"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "import-linter>=2.0",
]

[project.scripts]
arch-standard = "arch_standard.cli:_console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_standard"]
# The catalog is package data. `.released/` is a dotted dir, which hatchling
# excludes by default, so include it explicitly.
artifacts = ["src/arch_standard/rules/_catalog/.released/**/*.yaml"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
arch-commons = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-pyyaml", "arch-commons", "copier>=9"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["docs", "tests/fixtures", "ARCHITECTURE_STANDARD.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
norecursedirs = ["fixtures"]
markers = ["e2e: full build/install/generate/validate loop (slow)"]
