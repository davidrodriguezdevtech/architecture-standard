[project]
name = "arch-standard"
version = "0.1.0"
description = "Architecture Standard v1 — rule catalog, validator, and doc generator"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "import-linter>=2.0",
]

[project.scripts]
arch-standard = "arch_standard.cli:_console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_standard"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-pyyaml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["docs", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
